[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/web"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"

[phases.build]
cmds = [
  "mkdir -p web/sites/default/files",
  "chmod -R a+rwX web/sites/default/files",
  "chmod a-w web/sites/default/settings.php"
]

[start]
cmd = "mkdir -p /app/web/sites/default/files && chmod -R a+rwX /app/web/sites/default/files && chmod a-w /app/web/sites/default/settings.php && node /assets/scripts/prestart.mjs /assets/nginx.template.conf /nginx.conf && (php-fpm -y /assets/php-fpm.conf & nginx -c /nginx.conf)"
